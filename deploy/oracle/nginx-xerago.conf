# Place at /etc/nginx/sites-available/xerago
# Then: sudo ln -sf /etc/nginx/sites-available/xerago /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_PUBLIC_IP_OR_DOMAIN with the VM public IP (or a domain later).

upstream xerago_app {
    server 127.0.0.1:3847;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_PUBLIC_IP_OR_DOMAIN;

    client_max_body_size 16m;

    location / {
        proxy_pass http://xerago_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.io
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
